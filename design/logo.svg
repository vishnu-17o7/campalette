<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A6864"/>
      <stop offset="100%" stop-color="#004743"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B0EEE8"/>
      <stop offset="100%" stop-color="#95D2CC"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Outer ring (camera lens) -->
  <circle cx="256" cy="240" r="140" fill="none" stroke="url(#ringGrad)" stroke-width="16" opacity="0.3"/>
  <circle cx="256" cy="240" r="100" fill="none" stroke="url(#ringGrad)" stroke-width="12" opacity="0.5"/>

  <!-- Color palette dots arranged in triangle -->
  <circle cx="256" cy="140" r="28" fill="#7BC4BD" filter="url(#shadow)"/>
  <circle cx="170" cy="290" r="28" fill="#A8D29F" filter="url(#shadow)"/>
  <circle cx="342" cy="290" r="28" fill="#F5BB8C" filter="url(#shadow)"/>

  <!-- Center dot -->
  <circle cx="256" cy="240" r="20" fill="#FFFFFF" opacity="0.9"/>

  <!-- Camera aperture lines -->
  <line x1="256" y1="100" x2="256" y2="120" stroke="#B0EEE8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="256" y1="360" x2="256" y2="380" stroke="#B0EEE8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="116" y1="240" x2="136" y2="240" stroke="#B0EEE8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="376" y1="240" x2="396" y2="240" stroke="#B0EEE8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>


</svg>
