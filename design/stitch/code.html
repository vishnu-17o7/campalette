<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CAMPALETTE | Live Camera Experience</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@1,6..72,200..800&amp;family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">

        darkMode: "class",

          extend: {
            colors: {
              "inverse-primary": "#95d2cc",
              "primary-container": "#1f5f5b",
              "on-primary-fixed": "#00201e",
              "surface-container-highest": "#e6e2dd",
              "error-container": "#ffdad6",
              "secondary": "#81542e",
              "inverse-on-surface": "#f4f0eb",
              "on-tertiary": "#ffffff",
              "surface-container": "#f1ede8",
              "surface-bright": "#fdf9f4",
              "error": "#ba1a1a",
              "on-tertiary-container": "#a3d99b",

              "on-secondary": "#ffffff",

              "surface-tint": "#2a6864",
              "primary-fixed": "#b0eee8",

              "on-primary": "#ffffff",

              "on-error-container": "#93000a",
              "inverse-surface": "#31302d",
              "surface-container-low": "#f7f3ee",
              "tertiary": "#18481a",
              "surface-dim": "#ddd9d5",
              "surface": "#fdf9f4",
              "outline": "#6f7978",
              "background": "#fdf9f4",

              "on-primary-fixed-variant": "#06504c",

              "on-surface-variant": "#3f4947",
              "secondary-container": "#fec394",
              "outline-variant": "#bfc8c7",
              "on-primary-container": "#99d7d1",
              "on-background": "#1c1c19",
              "on-secondary-container": "#794e29",
              "on-secondary-fixed-variant": "#653d19"
            },
            fontFamily: {
              "headline": ["Newsreader"],
              "body": ["Manrope"],
              "label": ["Manrope"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .tonal-shift-surface-container-low {
            background-color: rgba(247, 243, 238, 0.85);
        }
        .scale-105-squishy-interaction:active {
            transform: translateX(-50%) scale(1.05);
        }
        .scale-95-on-press:active {
            transform: scale(0.95);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body text-on-surface overflow-hidden">
<!-- TopAppBar Shell -->
<header class="fixed top-0 w-full z-50 bg-[#fdf9f4]/85 dark:bg-[#1c1c19]/85 backdrop-blur-xl flex justify-between items-center px-6 py-4 w-full">
<div class="flex items-center gap-4">
<button class="text-[#004743] dark:text-[#52b2ab] scale-95-on-press">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<!-- Live View Pill -->
<div class="bg-primary/10 border border-primary/20 px-3 py-1 rounded-full flex items-center gap-2">
<span class="w-1.5 h-1.5 bg-error rounded-full"></span>
<span class="font-label tracking-widest uppercase text-[10px] text-primary font-bold">Live View</span>
</div>
</div>
<h1 class="font-serif italic text-2xl tracking-tighter text-[#004743] dark:text-[#52b2ab]">CAMPALETTE</h1>
<div class="flex items-center gap-4">
<div class="w-8 h-8 rounded-full bg-surface-container-highest overflow-hidden border border-outline-variant">
<img class="w-full h-full object-cover" data-alt="professional headshot of a creative director in soft natural light with warm skin tones" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBsdzGHAyQgjvf7uWKSwXCyQaht8sdE6-cmAii5El9bGWGgQ9QDQj_nGn987Iy4njSor3WTwFyWnxXGkZEcbDiZ4TyQvRAfCY5IPi_wjRHntIxxVupQpcJeTWpx5IzfVkWybMwHrCQiHLLgP5AQufNIdIhGPGIuixFbYNNMUp6FkxkcFZH5EnjELon6_Er-8a00x2QIVOhcKBNB0DS-P4NfSd-ph8z0KpvBe1mYBP-BnMPAGPuRQ7EcQ0MtsjUZYkFklmOoSb3aVTQ"/>
</div>
</div>
</header>
<!-- Main Canvas: Live Camera Experience -->
<main class="relative h-screen w-full bg-on-surface flex items-center justify-center">
<!-- Mock Camera Feed -->
<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover" data-alt="vibrant detail of mediterranean flowers and rustic textured walls with warm morning sunlight casting soft shadows" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB9UDJ1N-vlesHiiuSyb7TR8AmUuuIiPZG3kpVF_fDBTOAMnovoPVmi6d2ftkh9bTG1M8VVYACVX94XrHFeA5MZGaFYEZEAxEImLDWduYGkB_GUKc3N9113BkHLSd-MvdgK4Mg_US2Kd-SHsz_w0xzzkqvEdy2Pa0dU-W3tMkvjkHxoyb0O7ZeWHZfMzDMXNwpmBNDO7WL_7kCj4psssY0WAVGFmKw85oaGSeV9z3-g7NkgIqmLw34PZeeNB7ru2hWRomc7lr0oNA0"/>
</div>
<!-- Camera Reticle / Sample Point -->
<div class="relative z-10 pointer-events-none">
<div class="w-20 h-20 border-2 border-white/40 rounded-full flex items-center justify-center backdrop-blur-[2px]">
<div class="w-1 h-1 bg-white rounded-full"></div>
</div>
<!-- Dynamic Data Floating -->
<div class="absolute -right-32 top-1/2 -translate-y-1/2 bg-white/20 backdrop-blur-md px-3 py-2 rounded-lg border border-white/30">
<p class="font-headline italic text-white text-lg leading-none">#2A6864</p>
<p class="font-label text-[8px] uppercase tracking-widest text-white/80 mt-1">Deep Moss</p>
</div>
</div>
<!-- Translucent Glassmorphic Sampling Panel -->
<section class="absolute bottom-32 left-1/2 -translate-x-1/2 w-[92%] max-w-2xl bg-white/10 backdrop-blur-3xl rounded-xl p-6 border border-white/20 z-20">
<div class="flex justify-between items-end mb-6">
<div>
<span class="font-label tracking-widest uppercase text-[10px] text-white/70">Current Palette</span>
<h2 class="font-headline text-3xl text-white italic">Morning Atélier</h2>
</div>
<div class="text-right">
<span class="font-label tracking-widest uppercase text-[10px] text-white/70">Harmony</span>
<p class="font-body text-white font-bold text-sm">Analogous</p>
</div>
</div>
<!-- Color Swatches Row -->
<div class="flex justify-between items-center gap-4">
<!-- Swatch 1 (Active/Sampled) -->
<div class="flex flex-col items-center gap-3">
<div class="w-14 h-14 rounded-full bg-[#2A6864] ring-4 ring-primary-fixed shadow-[inset_0_2px_4px_rgba(0,0,0,0.2)]"></div>
<span class="font-headline text-white text-xs">#2A6864</span>
</div>
<!-- Swatch 2 -->
<div class="flex flex-col items-center gap-3 opacity-80">
<div class="w-14 h-14 rounded-full bg-[#fdf9f4] shadow-[inset_0_2px_4px_rgba(0,0,0,0.1)]"></div>
<span class="font-headline text-white text-xs">#FDF9F4</span>
</div>
<!-- Swatch 3 -->
<div class="flex flex-col items-center gap-3 opacity-60">
<div class="w-14 h-14 rounded-full bg-[#81542e] shadow-[inset_0_2px_4px_rgba(0,0,0,0.1)]"></div>
<span class="font-headline text-white text-xs">#81542E</span>
</div>
<!-- Swatch 4 -->
<div class="flex flex-col items-center gap-3 opacity-40">
<div class="w-14 h-14 rounded-full bg-[#18481a] shadow-[inset_0_2px_4px_rgba(0,0,0,0.1)]"></div>
<span class="font-headline text-white text-xs">#18481A</span>
</div>
<!-- Swatch 5 (Empty/Add) -->
<div class="flex flex-col items-center gap-3">
<div class="w-14 h-14 rounded-full border-2 border-dashed border-white/30 flex items-center justify-center">
<span class="material-symbols-outlined text-white/50" data-icon="add">add</span>
</div>
<span class="font-label text-[8px] text-white/30 uppercase tracking-widest">Capture</span>
</div>
</div>
</section>
</main>
<!-- BottomNavBar Shell -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center pb-8 pt-2 bg-[#f7f3ee]/90 dark:bg-[#2a2a26]/90 backdrop-blur-2xl no-border-tonal-layering">
<!-- Floating Wrapper as defined by style_component_shape -->
<div class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-md rounded-full px-2 py-3 flex justify-around items-center shadow-[0_12px_32px_rgba(28,28,25,0.06)]">
<a class="text-[#1c1c19]/50 dark:text-[#fdf9f4]/50 p-3 hover:text-[#1f5f5b] transition-all scale-95-on-press" href="#">
<span class="material-symbols-outlined" data-icon="palette">palette</span>
</a>
<a class="text-[#1c1c19]/50 dark:text-[#fdf9f4]/50 p-3 hover:text-[#1f5f5b] transition-all scale-95-on-press" href="#">
<span class="material-symbols-outlined" data-icon="auto_awesome">auto_awesome</span>
</a>
<!-- Active Navigation: Photo Camera (The Capture Button) -->
<button class="bg-[#004743] text-white rounded-full p-4 scale-110 -translate-y-2 shadow-lg scale-105-squishy-interaction">
<span class="material-symbols-outlined" data-icon="photo_camera" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</button>
<a class="text-[#1c1c19]/50 dark:text-[#fdf9f4]/50 p-3 hover:text-[#1f5f5b] transition-all scale-95-on-press" href="#">
<span class="material-symbols-outlined" data-icon="history">history</span>
</a>
<a class="text-[#1c1c19]/50 dark:text-[#fdf9f4]/50 p-3 hover:text-[#1f5f5b] transition-all scale-95-on-press" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</a>
</div>
</nav>
<!-- Camera Controls (Overlay Right) -->
<aside class="fixed right-6 top-1/2 -translate-y-1/2 flex flex-col gap-6 z-30">
<button class="w-12 h-12 rounded-full bg-white/10 backdrop-blur-md border border-white/20 text-white flex items-center justify-center scale-95-on-press">
<span class="material-symbols-outlined" data-icon="flip_camera_ios">flip_camera_ios</span>
</button>
<button class="w-12 h-12 rounded-full bg-white/10 backdrop-blur-md border border-white/20 text-white flex items-center justify-center scale-95-on-press">
<span class="material-symbols-outlined" data-icon="flash_on">flash_on</span>
</button>
<button class="w-12 h-12 rounded-full bg-white/10 backdrop-blur-md border border-white/20 text-white flex items-center justify-center scale-95-on-press">
<span class="material-symbols-outlined" data-icon="grid_on">grid_on</span>
</button>
</aside>
</body></html>
